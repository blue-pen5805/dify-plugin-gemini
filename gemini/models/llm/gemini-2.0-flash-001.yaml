model: gemini-2.0-flash-001
label:
  en_US: Gemini 2.0 Flash 001
model_type: llm
deprecated: true
features:
  - agent-thought
  - vision
  - tool-call
  - stream-tool-call
  - document
  - video
  - audio
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    default: 0.95
  - name: top_k
    label:
      zh_Hans: 取样数量
      en_US: Top k
    type: int
    help:
      zh_Hans: 仅从每个后续标记的前 K 个选项中采样。
      en_US: Only sample from the top K options for each subsequent token.
    required: false
  - name: max_output_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 8192
  - name: grounding
    type: boolean
    required: true
    default: false
    label:
      en_US: Grounding
      zh_Hans: 事实核查
      ja_JP: 事実チェック
    help:
      en_US: Grounding with Google Search
      zh_Hans: Google 事实核查
      ja_JP: Google検索に基づいた応答をします。
  - name: include_search_sources
    type: boolean
    required: true
    default: false
    label:
      en_US: Include Search Sources
    help:
      en_US: include search results in the response text. (if grounding is enabled)
  - name: code_execution
    type: boolean
    required: true
    default: false
    label:
        en_US: Code execution
        zh_Hans: 代码执行
        ja_JP: コード実行
    help:
      en_US: Lets Gemini use code to solve complex tasks
      zh_Hans: 让 Gemini 使用代码来解决复杂任务。
      ja_JP: Gemini にコードを使って複雑なタスクを解決させましょう。
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
  - name: json_schema
    use_template: json_schema
pricing:
  input: '0.10'
  output: '0.40'
  unit: '0.000001'
  currency: USD
